<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iOS 主屏幕 cookie 测试</title>
<!-- #8：验证 iOS「添加到主屏幕」时是否把 Safari 的 cookie / localStorage 复制给 PWA。
     纯静态，无 Service Worker、无外部请求、无服务端。 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cookie测试">
<meta name="theme-color" content="#c41e3a">
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --mute:#666; --line:#ddd; --ok:#0a7d32; --bad:#c41e3a; --warn:#b26a00; --card:#f6f6f6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --mute:#aaa; --line:#333; --ok:#4cd27a; --bad:#ff6b81; --warn:#ffb648; --card:#1c1c1c; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; padding-top:max(16px, env(safe-area-inset-top)); background:var(--bg); color:var(--fg);
         font:16px/1.5 -apple-system, "PingFang SC", system-ui, sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  .mode { display:inline-block; padding:4px 10px; border-radius:6px; font-weight:600; color:#fff; }
  .mode.safari { background:#0a66c2; } .mode.pwa { background:#c41e3a; }
  .code { font:700 40px/1.2 ui-monospace, Menlo, monospace; letter-spacing:4px; margin:8px 0; }
  .card { background:var(--card); border-radius:10px; padding:12px; margin:12px 0; }
  .verdict { font-weight:700; font-size:18px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); } .mute { color:var(--mute); font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td:first-child { width:45%; }
  td, th { border-bottom:1px solid var(--line); padding:6px 4px; text-align:left; vertical-align:top; word-break:break-all; }
  button { font:inherit; padding:10px 14px; margin:4px 4px 4px 0; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  button.primary { background:#c41e3a; color:#fff; border-color:#c41e3a; }
  ol { padding-left:20px; margin:4px 0; }
  textarea { width:100%; height:160px; font:12px ui-monospace, Menlo, monospace; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; }
</style>
</head>
<body>
<h1>iOS 主屏幕 cookie 测试 <span class="mute">#8</span></h1>
<div id="mode"></div>

<div id="safari" hidden>
  <div class="card">
    <div>已在 Safari 写入测试数据，认领码：</div>
    <div class="code" id="s-code"></div>
    <div class="mute" id="s-time"></div>
  </div>
  <div class="card">
    <b>下一步</b>
    <ol>
      <li>截图本页。</li>
      <li>点底部「分享」→「添加到主屏幕」→「添加」（iOS 26 起确认「作为 Web App 打开」是打开的）。</li>
      <li>回到桌面，点新图标「Cookie测试」打开。</li>
    </ol>
  </div>
  <div class="card">
    <b>可选：区分「快照」还是「共享」</b>
    <div class="mute">添加到主屏幕<u>之后</u>再回到 Safari 点下面按钮，然后彻底关闭 PWA（上滑划掉）再打开。PWA 能看到它说明两边共用 cookie；看不到说明只在添加那一刻复制了一份。</div>
    <button id="btn-after">写入「添加后」cookie</button>
    <span id="after-done" class="ok"></span>
  </div>
</div>

<div id="pwa" hidden>
  <div class="card">
    <div class="verdict" id="p-verdict"></div>
    <div class="code" id="p-code"></div>
    <div class="mute" id="p-first"></div>
  </div>
</div>

<div class="card">
  <b>能读到的数据</b>
  <table id="tbl"><thead><tr><th>项</th><th>值</th></tr></thead><tbody></tbody></table>
</div>

<div class="card">
  <b>环境</b>
  <table id="env"><tbody></tbody></table>
</div>

<div class="card">
  <button class="primary" id="btn-copy">复制结果</button>
  <button id="btn-reload">刷新</button>
  <button id="btn-regen" hidden>重新生成认领码</button>
  <button id="btn-clear">清除本环境的测试数据</button>
  <div id="copy-msg" class="mute"></div>
  <textarea id="out" readonly hidden></textarea>
</div>

<script>
(function () {
  'use strict';
  var P = 'gdtest_';
  var YEAR = 31536000;
  var secure = location.protocol === 'https:' ? '; Secure' : '';

  function standalone() {
    return window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }
  function cookies() {
    var out = {};
    document.cookie.split(';').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i < 0) return;
      var k = kv.slice(0, i).trim();
      if (k.indexOf(P) === 0) out[k] = decodeURIComponent(kv.slice(i + 1).trim());
    });
    return out;
  }
  function setCookie(name, value, attrs) {
    document.cookie = P + name + '=' + encodeURIComponent(value) + '; Path=/' + attrs + secure;
  }
  function delCookie(name) {
    document.cookie = name + '=; Path=/; Max-Age=0' + secure;
    document.cookie = name + '=; Path=/; Max-Age=0; SameSite=Strict' + secure;
  }
  function ls(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(P + k);
      localStorage.setItem(P + k, v);
    } catch (e) { return null; }
  }
  function now() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
      p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  function codeOf(v) { return v ? String(v).split('|')[0] : null; }
  function el(id) { return document.getElementById(id); }
  function row(tbody, k, v, cls) {
    var tr = document.createElement('tr');
    var a = document.createElement('td'); a.textContent = k;
    var b = document.createElement('td'); b.textContent = v; if (cls) b.className = cls;
    tr.appendChild(a); tr.appendChild(b); tbody.appendChild(tr);
  }

  function writeSafari(force) {
    var c = cookies();
    if (!force && c[P + 'persist']) return;
    var code = String(Math.floor(1000 + Math.random() * 9000));
    var v = code + '|' + now();
    setCookie('persist', v, '; Max-Age=' + YEAR + '; SameSite=Lax');
    setCookie('session', v, '; SameSite=Lax');
    setCookie('strict', v, '; Max-Age=' + YEAR + '; SameSite=Strict');
    ls('ls', v);
    delCookie(P + 'after');
  }

  var isPwa = standalone();
  var firstPwaOpen = false;
  if (isPwa) {
    // PWA 侧自己的标记：判断是否首开，以及回看 Safari 是否反向可见。
    firstPwaOpen = !ls('pwa_seen');
    if (firstPwaOpen) ls('pwa_seen', now());
    if (!cookies()[P + 'pwa']) setCookie('pwa', now(), '; Max-Age=' + YEAR + '; SameSite=Lax');
  } else {
    writeSafari(false);
  }

  var c = cookies();
  var lsv = ls('ls');
  var ref = codeOf(c[P + 'persist']) || codeOf(lsv);

  el('mode').innerHTML = isPwa
    ? '<span class="mode pwa">主屏幕 PWA 模式（standalone）</span>'
    : '<span class="mode safari">浏览器模式（Safari）</span>';

  if (isPwa) {
    el('pwa').hidden = false;
    var got = !!(c[P + 'persist'] || c[P + 'session'] || c[P + 'strict']);
    el('p-verdict').className = 'verdict ' + (got ? 'ok' : 'bad');
    el('p-verdict').textContent = got
      ? '✅ 读到了 Safari 写入的 cookie，认领码：'
      : '❌ 没读到 Safari 写入的 cookie';
    el('p-code').textContent = got ? ref : '—';
    el('p-first').textContent = firstPwaOpen
      ? '这是本 PWA 第一次打开（以首开结果为准）'
      : 'PWA 非首次打开（首开时间 ' + ls('pwa_seen') + '）';
  } else {
    el('safari').hidden = false;
    el('btn-regen').hidden = false;
    el('s-code').textContent = ref;
    el('s-time').textContent = '写入时间 ' + (c[P + 'persist'] || '').split('|')[1];
  }

  function show(v) { return v == null ? '（无）' : v; }
  function cls(v) { return v == null ? 'bad' : (codeOf(v) === ref ? 'ok' : 'warn'); }
  var tb = el('tbl').tBodies[0];
  var items = [
    ['cookie 持久 Max-Age=1年 Lax', c[P + 'persist']],
    ['cookie 会话（无过期）Lax', c[P + 'session']],
    ['cookie 持久 SameSite=Strict', c[P + 'strict']],
    ['localStorage', lsv],
    ['cookie「添加后」写入（可选步骤）', c[P + 'after']],
    ['cookie 由 PWA 写入', c[P + 'pwa']],
    ['localStorage 由 PWA 写入（首开时间）', ls('pwa_seen')]
  ];
  items.forEach(function (it, i) { row(tb, it[0], show(it[1]), i < 4 ? cls(it[1]) : (it[1] == null ? 'mute' : 'ok')); });

  var ua = navigator.userAgent;
  var m = ua.match(/OS (\d+)[_.](\d+)(?:[_.](\d+))?/);
  var env = {
    'iOS 版本（UA）': m ? m[1] + '.' + m[2] + (m[3] ? '.' + m[3] : '') : '未识别',
    'navigator.standalone': String(window.navigator.standalone),
    'display-mode: standalone': String(!!(window.matchMedia && matchMedia('(display-mode: standalone)').matches)),
    'cookieEnabled': String(navigator.cookieEnabled),
    'URL': location.href,
    '当前时间': now(),
    'UA': ua
  };
  var eb = el('env').tBodies[0];
  Object.keys(env).forEach(function (k) { row(eb, k, env[k]); });

  el('btn-after').onclick = function () {
    setCookie('after', (ref || '?') + '|' + now(), '; Max-Age=' + YEAR + '; SameSite=Lax');
    el('after-done').textContent = '已写入 ' + now();
  };
  el('btn-reload').onclick = function () { location.reload(); };
  el('btn-regen').onclick = function () { writeSafari(true); location.reload(); };
  el('btn-clear').onclick = function () {
    Object.keys(cookies()).forEach(delCookie);
    try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(P) === 0) localStorage.removeItem(k); }); } catch (e) {}
    location.reload();
  };
  el('btn-copy').onclick = function () {
    var lines = ['[#8 iOS cookie 测试] ' + (isPwa ? 'PWA' : 'Safari') + (isPwa ? (firstPwaOpen ? ' 首开' : ' 非首开') : ''),
      '认领码: ' + show(ref)];
    items.forEach(function (it) { lines.push('- ' + it[0] + ': ' + show(it[1])); });
    Object.keys(env).forEach(function (k) { lines.push('- ' + k + ': ' + env[k]); });
    var text = lines.join('\n');
    var out = el('out'); out.hidden = false; out.value = text;
    function fallback() { out.focus(); out.select(); el('copy-msg').textContent = '请长按文本框全选复制'; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { el('copy-msg').textContent = '已复制，可直接粘贴到 #8'; }, fallback);
    } else { fallback(); }
  };
})();
</script>
</body>
</html>
