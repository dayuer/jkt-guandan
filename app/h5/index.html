<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget=resizes-content：安卓 Chrome 108 起键盘默认只缩可视视口，
         贴底的弹层（称呼、绑定 WhatsApp）会被键盘和自动填充条盖住；让键盘把布局视口也缩上去（#130）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- 页面底色 --paper；manifest 的 theme_color 必须同值，不然安卓 standalone 的状态栏颜色随入口变（#63 审查建议 4，pwa.test.ts 盯着）。 -->
    <meta name="theme-color" content="#F6EFE4" />
    <meta name="format-detection" content="telephone=no" />
    <title>%APP_NAME%</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- 用 .json 而不是 .webmanifest：Go 的 mime 表里没有后者，内嵌的静态服务会把它
         发成 application/octet-stream，Chrome 会因此拒绝这份 manifest。 -->
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS 要这两行才认「加到主屏幕」后的独立窗口；web push 也只有在主屏幕上打开才可用（§6）。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="掼蛋" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
