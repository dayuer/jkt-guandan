name: protocol
# Enforces the parts of docs/agents/COORDINATION.md a machine can check: every PR says which role
# opened it, nothing carries AI-assistant attribution, and implementation or audit work points at
# the issue it answers. PR text is read from the event file with jq, never interpolated into the
# script, so a body cannot inject shell.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check
        run: |
          set -eu
          body=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          title=$(jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH")
          head_ref=$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")
          base_sha=$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")
          head_sha=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          fail=0

          # 1. The first line that is neither blank nor an HTML comment names the role.
          first=$(printf '%s\n' "$body" | sed -e 's/\r$//' | grep -v -e '^[[:space:]]*$' -e '^[[:space:]]*<!--' | head -n 1)
          if ! printf '%s' "$first" | grep -Eq '^\[(coord|impl|auditor|design)\]'; then
            echo "::error::PR 描述第一行须为角色标签 [coord]/[impl]/[auditor]/[design]，当前是: ${first:-<空>}"
            fail=1
          fi

          # 2. No AI-assistant attribution in the title, the body or any commit message.
          # Match attribution *forms* only (trailers, "generated with" footers, the bot address), so
          # ordinary mentions of repo paths or product names do not fail the check (#28). Author and
          # committer identities are still matched on the bare names below.
          pattern='^[[:space:]]*co-authored-by:.*(claude|anthropic)|noreply@anthropic\.com|generated (with|by) .*\b(claude|ai|assistant)\b'
          ident='claude|anthropic'
          if printf '%s\n%s\n' "$title" "$body" | grep -Eiq "$pattern"; then
            echo "::error::PR 标题或描述含 AI 助手署名，见 COORDINATION.md §1"
            fail=1
          fi
          bad=$(git log --format='%h %s' "$base_sha..$head_sha" --grep="$pattern" -i -E || true)
          if [ -n "$bad" ]; then
            echo "::error::以下提交的信息含 AI 助手署名："
            printf '%s\n' "$bad"
            fail=1
          fi
          authors=$(git log --format='%an <%ae>%n%cn <%ce>' "$base_sha..$head_sha" | grep -Ei "$ident" || true)
          if [ -n "$authors" ]; then
            echo "::error::作者或提交者含 AI 助手身份：$authors"
            fail=1
          fi

          # 3. Implementation and audit branches answer an issue.
          case "$head_ref" in
            impl/*|audit/*)
              if ! printf '%s' "$body" | grep -Eiq '(fixes|closes|resolves|refs) #[0-9]+'; then
                echo "::error::impl/ 与 audit/ 分支的 PR 须关联 issue（Fixes #N 或 Refs #N）"
                fail=1
              fi
              ;;
          esac

          exit "$fail"
