name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # 分支保护要求的必过检查，job 名必须是 test（docs/server-design.md §9）。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/h5/package-lock.json
            app/minigame/package-lock.json

      - name: go vet
        run: go vet ./...

      # 每个反向代理的 location 都要写全转发头（#35 的前提），webroot、TLS 加固也要对。
      - name: nginx 模板检查
        run: scripts/check-nginx.sh deploy/nginx/guandan.synon.ai.conf

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: 安装前端依赖
        run: cd app/h5 && npm ci

      - name: 前端类型检查与构建
        run: cd app/h5 && npm run build

      # 放在构建之后，这样 httpapi 的用例能验证真的被打进二进制的前端页面。
      # -race 需要 CGO，只在测试里打开，发布构建仍然是 CGO_ENABLED=0。
      - name: go test -race
        run: go test -race ./...

      - name: 前端测试
        run: cd app/h5 && npm test

      - name: 前端依赖审计
        run: cd app/h5 && npm audit --omit=dev

      # 小游戏（#85）：复用 app/h5/src 的纯逻辑，H5 那边改了接口类型这里会先报出来。
      - name: 小游戏类型检查、测试、打包
        run: cd app/minigame && npm ci && npm run typecheck && npm test && npm run build

      - name: docker build
        run: docker build --build-arg BUILD=${{ github.sha }} -t guandan:ci .

      # 按 §8 的部署参数跑：只读根文件系统、去掉全部 capability；
      # 非开发模式必须告诉它本站地址（config.Load 会检查）。
      - name: 容器冒烟测试
        run: |
          set -euo pipefail
          docker run -d --name guandan-ci --read-only --cap-drop ALL \
            --health-interval 2s --health-start-period 5s \
            -e GUANDAN_PUBLIC_URL=http://127.0.0.1:8080 \
            -p 8080:8080 -v guandan-data:/data guandan:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "--- /healthz"
          curl -fsS http://127.0.0.1:8080/healthz
          echo
          echo "--- /readyz"
          curl -fsS http://127.0.0.1:8080/readyz
          echo
          echo "--- /"
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="app"'
          echo "内嵌页面已提供"
          echo "--- 安全响应头"
          curl -fsSI http://127.0.0.1:8080/ | grep -i 'content-security-policy'
          echo "--- 构建号（§13.4）"
          curl -fsSI http://127.0.0.1:8080/healthz | grep -i "x-app-build: ${{ github.sha }}"
          echo "--- Docker HEALTHCHECK（guandan healthcheck 子命令）"
          for _ in $(seq 1 30); do
            health=$(docker inspect -f '{{.State.Health.Status}}' guandan-ci)
            if [ "$health" = healthy ]; then break; fi
            sleep 1
          done
          echo "health=$health"
          test "$health" = healthy

      # §13.4：服务器端的发布逻辑（deploy-remote.sh）：换容器、切 current、三种失败的回滚。
      - name: 发布与回滚测试
        run: scripts/test-deploy.sh guandan:ci

      # §13.3：加密备份到「异地」，在全新数据卷上恢复，服务起来后数据都在。
      - name: 恢复演练
        run: scripts/restore-drill.sh guandan:ci

      - name: 容器日志
        if: always()
        run: docker logs guandan-ci 2>&1 || true

      - name: 清理
        if: always()
        run: docker rm -f guandan-ci 2>/dev/null || true


  # 浏览器端到端冒烟（#72）：本地构建的二进制 + seed，无头 Chromium，375×667。
  # 先不进分支保护，稳定一段时间后由 coord 加成必过。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/h5/package-lock.json

      - name: 构建二进制（含前端）
        run: make build

      - name: 安装 Chromium
        run: cd app/h5 && npx playwright install --with-deps chromium

      - name: 端到端冒烟
        run: cd app/h5 && npm run e2e

      - name: 失败时上传 trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: app/h5/test-results/
          retention-days: 7
