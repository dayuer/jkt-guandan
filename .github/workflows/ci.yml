name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # 分支保护要求的必过检查，job 名必须是 test（docs/server-design.md §9）。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: 安装前端依赖
        run: cd web && npm ci

      - name: 前端类型检查与构建
        run: cd web && npm run build

      # 放在构建之后，这样 httpapi 的用例能验证真的被打进二进制的前端页面。
      # -race 需要 CGO，只在测试里打开，发布构建仍然是 CGO_ENABLED=0。
      - name: go test -race
        run: go test -race ./...

      - name: 前端测试
        run: cd web && npm test

      - name: 前端依赖审计
        run: cd web && npm audit --omit=dev

      - name: docker build
        run: docker build --build-arg BUILD=${{ github.sha }} -t guandan:ci .

      # 按 §8 的部署参数跑：只读根文件系统、去掉全部 capability；
      # 非开发模式必须告诉它本站地址（config.Load 会检查）。
      - name: 容器冒烟测试
        run: |
          set -euo pipefail
          docker run -d --name guandan-ci --read-only --cap-drop ALL \
            --health-interval 2s --health-start-period 5s \
            -e GUANDAN_PUBLIC_URL=http://127.0.0.1:8080 \
            -p 8080:8080 -v guandan-data:/data guandan:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "--- /healthz"
          curl -fsS http://127.0.0.1:8080/healthz
          echo
          echo "--- /readyz"
          curl -fsS http://127.0.0.1:8080/readyz
          echo
          echo "--- /"
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="app"'
          echo "内嵌页面已提供"
          echo "--- 安全响应头"
          curl -fsSI http://127.0.0.1:8080/ | grep -i 'content-security-policy'
          echo "--- 构建号（§13.4）"
          curl -fsSI http://127.0.0.1:8080/healthz | grep -i "x-app-build: ${{ github.sha }}"
          echo "--- Docker HEALTHCHECK（guandan healthcheck 子命令）"
          for _ in $(seq 1 30); do
            health=$(docker inspect -f '{{.State.Health.Status}}' guandan-ci)
            if [ "$health" = healthy ]; then break; fi
            sleep 1
          done
          echo "health=$health"
          test "$health" = healthy

      # §13.4：发布脚本在就绪检查失败时自动回滚。
      - name: 发布与回滚测试
        run: scripts/test-deploy.sh guandan:ci

      # §13.3：加密备份到「异地」，在全新数据卷上恢复，服务起来后数据都在。
      - name: 恢复演练
        run: scripts/restore-drill.sh guandan:ci

      - name: 容器日志
        if: always()
        run: docker logs guandan-ci 2>&1 || true

      - name: 清理
        if: always()
        run: docker rm -f guandan-ci 2>/dev/null || true

  # §13.4：main 上构建镜像推送到 GHCR，tag 用提交 SHA，同时更新 :main。
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 构建并推送
        run: |
          set -euo pipefail
          image=ghcr.io/${{ github.repository }}
          docker build --build-arg BUILD=${{ github.sha }} -t "$image:${{ github.sha }}" -t "$image:main" .
          docker push "$image:${{ github.sha }}"
          docker push "$image:main"
