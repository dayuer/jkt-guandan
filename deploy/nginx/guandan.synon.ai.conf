# guandan.synon.ai 的 nginx 站点：照抄线上的 /etc/nginx/sites-available/guandan.synon.ai（coord 维护，2026-10-14 对齐）。
# 改动先在这里改、过 scripts/check-nginx.sh，再由 coord 同步到服务器并 nginx -t。
# 只定义本站，不改全局配置；同机还有别的站点。
#
# 注意 nginx 的继承规则：location 里只要写了一条 proxy_set_header / add_header，
# server 级的同类指令就全部不再继承。所以每个反向代理的 location 都要把
# Host、X-Real-IP、X-Forwarded-For、X-Forwarded-Proto 写全（scripts/check-nginx.sh 会检查）。
#
# 随时掼掼蛋（dayuer/jkt-guandan）。拓扑见 issue #12：nginx 管 TLS 和静态前端，API 与实时转发到容器 127.0.0.1:18200
server {
    listen 80;
    listen [::]:80;
    server_name guandan.synon.ai;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guandan.synon.ai;

    ssl_certificate /etc/letsencrypt/live/guandan.synon.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guandan.synon.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # 与容器的请求体上限一致（§12.2）
    client_max_body_size 64k;

    # 静态前端：current 是指向 /var/www/guandan/<sha> 的符号链接，发布时原子切换
    root /var/www/guandan/current;
    # 全局开了 open_file_cache；本站关掉，发布时切换 current 符号链接立即生效（不用 reload）
    open_file_cache off;

    # 带哈希的资源长期缓存
    location /assets/ {
        include snippets/guandan-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 单页应用：其余路径回落到 index.html，且 HTML 不缓存（新版本能及时生效，§13.4）
    location / {
        include snippets/guandan-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # API、分享页（OG 注入、海报、.ics）、健康检查：转给容器；安全头由应用设置，这里只补 HSTS
    location ~ ^/(api/|g/|healthz$|readyz$) {
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass http://127.0.0.1:18200;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # WebSocket（§5.5）：心跳 25 秒，读超时给到 75 秒
    location = /ws {
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass http://127.0.0.1:18200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
