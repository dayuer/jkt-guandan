# guandan.synon.ai 的 nginx 站点模板（生产拓扑见 #12、docs/runbook.md §1）。
# 服务器上的实际文件由 coord 维护在 /etc/nginx/sites-available/guandan.synon.ai，以这份模板为准对齐。
# 只定义本站，不改全局配置；同机还有别的站点。
#
#   静态前端：/var/www/guandan/current → <短 SHA> 目录（scripts/deploy-remote.sh 原子切换）
#   应用：    127.0.0.1:18200（容器内 :8080）
#   证书：    certbot webroot（/var/www/letsencrypt），跟随系统自动续期

upstream guandan_app {
    server 127.0.0.1:18200;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name guandan.synon.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guandan.synon.ai;

    ssl_certificate     /etc/letsencrypt/live/guandan.synon.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guandan.synon.ai/privkey.pem;

    root /var/www/guandan/current;
    index index.html;

    # 全局配置开着 open_file_cache；本站关掉，否则切换 current 后最多 60 秒还在返回旧文件。
    open_file_cache off;

    client_max_body_size 64k;   # 与应用的请求体上限一致（§12.2）

    # ---- 反向代理到应用 ----
    # 应用只在对端是可信代理（127.0.0.1、docker 网桥）时才看这两个头（GUANDAN_TRUSTED_PROXIES）。
    # 两个都必须由这里覆盖设置，否则客户端自己带的值会原样透传过去，按 IP 限流就能被绕过。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 应用自己设置 CSP 等安全头（§10.6、§10.7），这里只补 HSTS。
    location /api/ {
        proxy_pass http://guandan_app;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location /g/ {
        proxy_pass http://guandan_app;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location = /healthz {
        proxy_pass http://guandan_app;
    }
    location = /readyz {
        proxy_pass http://guandan_app;
    }
    # WebSocket（#18）：升级头要显式转发，读超时放长，心跳由应用管（§5.5）。
    location = /ws {
        proxy_pass http://guandan_app;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    # /metrics 不对外：它只在容器内的 127.0.0.1:9090 上监听，这里也不转发（§13.7）。

    # ---- 静态前端 ----
    # 文件名带哈希，可以长期缓存。
    location /assets/ {
        include snippets/guandan-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # HTML 不缓存，发布后立刻生效；单页应用的路由都回落到 index.html。
    location / {
        include snippets/guandan-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
