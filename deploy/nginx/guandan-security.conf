# /etc/nginx/snippets/guandan-security.conf：nginx 直接返回的静态文件用的安全头，
# 与应用的 securityHeaders 中间件一致（docs/server-design.md §10.6、§10.7，internal/httpapi/middleware.go）。
# 注意 nginx 的 add_header 不会从上一层继承到写了 add_header 的 location 里，所以每个静态 location 都要 include。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
